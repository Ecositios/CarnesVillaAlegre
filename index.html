
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carnes Villa Alegre</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <img src="favicon.png" alt="Carnes Villa Alegre" class="logo">

        <h1>Carnes Villa Alegre</h1>

        <p>Consulta nuestros productos y precios</p>
    </header>
    <main class="container">

        <section class="toolbar">
            <input
                type="search"
                id="search"
                placeholder="Buscar producto..."
                aria-label="Buscar producto"
            >
            <span id="status">Cargando catálogo...</span>
        </section>

        <section id="catalog" class="catalog">
        </section>

    </main>

    <footer>
        <p>Los precios y la disponibilidad pueden cambiar.
        Consulta antes de realizar tu pedido.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
